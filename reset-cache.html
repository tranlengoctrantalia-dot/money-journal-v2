<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe8"><title>Làm mới Money Journal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f2efe8;color:#17130f}main{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);padding:28px;border:2px solid #17130f;background:#fffdf8;box-shadow:8px 8px 0 #c9ff4a}.k{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.n{font-size:42px;font-weight:950;letter-spacing:-.06em;line-height:.95;margin:10px 0 12px}.s{font-size:13px;line-height:1.5;color:#686259}.ok{display:none;margin-top:18px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7c4dff;margin-right:7px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><main><div class="box"><div class="k">Money Journal · Cache Reset</div><div class="n">Đang dọn bản cũ.</div><div class="s">Chỉ xóa cache và service worker cũ. Dữ liệu giao dịch trong localStorage được giữ nguyên.</div><div class="ok" id="ok"><span class="dot"></span>Mở bản mới…</div></div></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('ok').style.display='block';const u=new URL('./index.html',location.href);u.searchParams.set('fresh',Date.now());u.searchParams.set('v','901');setTimeout(()=>location.replace(u.href),700)}catch(e){document.querySelector('.s').textContent='Không dọn tự động được. Hãy đóng tab này rồi mở lại link mới.';document.getElementById('ok').style.display='none'}})();</script></body></html>
