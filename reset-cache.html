<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4f0"><title>Làm mới Money Journal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f4f0;color:#111827}main{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);padding:28px;border:1px solid #e7e2d7;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(17,24,39,.08)}.k{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#b88934}.n{font-size:36px;font-weight:900;letter-spacing:-.05em;line-height:.98;margin:10px 0 12px}.s{font-size:13px;line-height:1.5;color:#6b7280}.ok{display:none;margin-top:18px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d6a443;margin-right:7px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><main><div class="box"><div class="k">Money Journal · V12</div><div class="n">Đang dọn cache cũ.</div><div class="s">Chỉ xóa cache và service worker. Giao dịch trong localStorage được giữ nguyên.</div><div class="ok" id="ok"><span class="dot"></span>Mở giao diện mới…</div></div></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('ok').style.display='block';const u=new URL('./fresh-v12.html',location.href);u.searchParams.set('fresh',Date.now());setTimeout(()=>location.replace(u.href),450)}catch(e){document.querySelector('.s').textContent='Không dọn tự động được. Đóng tab này rồi mở lại link fresh-v12.';document.getElementById('ok').style.display='none'}})();</script></body></html>
