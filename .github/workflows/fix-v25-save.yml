name: Fix V2.5 save handler
on:
  push:
    paths:
      - '.github/workflows/fix-v25-save.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch save handler
        run: |
          sed -i 's/onclick=save;/onclick=saveRows;/' v25.js
          sed -i 's/function save(){/function saveRows(){/' v25.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v25.js
          git commit -m 'Fix V2.5 save handler [skip ci]' || exit 0
          git push