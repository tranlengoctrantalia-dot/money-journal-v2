name: Bump Money Journal V2.3
on:
  push:
    paths:
      - 'v22.js'
      - 'v22.css'
      - '.github/workflows/bump-v23.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('v22.css?v=220','v22.css?v=230').replace('v22.js?v=220','v22.js?v=230')
          p.write_text(s)
          p=Path('sw.js')
          s=p.read_text()
          import re
          s=re.sub(r"const CACHE = '[^']+';", "const CACHE = 'money-journal-v2-2.3.0-2026-09-12';", s, count=1)
          p.write_text(s)
          PY
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Refresh Money Journal V2.3 assets [skip ci]'
          git push
